name: Hourly Push Trigger

on:
  schedule:
    # GitHub 支援每小時的 0 分觸發
    - cron: '0 * * * *'
  # 允許手動觸發測試
  workflow_dispatch: 

jobs:
  ping-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel Cron API
        run: |
          curl -X POST "https://body-track-pwa.vercel.app/" \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
          -H "Content-Type: application/json"