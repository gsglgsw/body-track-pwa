<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的輕盈日記</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#fff1f2">
  <link rel="icon" type="image/png" href="https://placehold.co/192x192/fff1f2/e5989b.png?text=Diary">
  <link rel="apple-touch-icon" href="https://placehold.co/192x192/fff1f2/e5989b.png?text=Diary">

  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<!-- 🚩 引入 Google Identity Services SDK -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="bg-stone-50 text-stone-800 font-sans antialiased">
    <main id="app" class="max-w-md mx-auto bg-white min-h-screen shadow-sm relative border-x border-stone-100 flex flex-col">

        <!-- 頂部 Header -->
        <header class="bg-rose-50 text-stone-700 p-4 flex justify-between items-center border-b border-rose-100 shrink-0">
            <h1 class="text-lg font-bold tracking-wide">我的輕盈日記</h1>
            <button id="syncBtn" class="text-sm bg-rose-400 hover:bg-rose-500 text-white px-4 py-1.5 rounded-full transition-colors shadow-sm font-medium">
                儲存紀錄
            </button>
        </header>

        <!-- 視圖 1：圖表視圖 -->
        <div id="view-chart" class="flex-1 flex flex-col">
            <nav class="flex justify-around bg-white p-3 text-sm border-b border-stone-100 shrink-0">
                <button class="px-5 py-1.5 rounded-full bg-rose-200 text-rose-800 font-medium" data-range="week">1週</button>
                <button class="px-5 py-1.5 rounded-full text-stone-400 hover:bg-stone-50 transition-colors" data-range="month">1個月</button>
                <button class="px-5 py-1.5 rounded-full text-stone-400 hover:bg-stone-50 transition-colors" data-range="year">1年</button>
            </nav>
            <section class="p-4 bg-white flex-1 min-h-[400px]">
                <canvas id="bodyChart"></canvas>
            </section>
        </div>

        <!-- 視圖 2：日曆視圖 -->
        <div id="view-calendar" class="flex-1 flex flex-col hidden bg-stone-50">
            <div class="p-4 flex justify-between items-center bg-white border-b border-stone-100 shadow-sm relative z-30">
                <button id="prevMonth" class="text-stone-400 hover:text-rose-400 p-2 shrink-0 transition-colors outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>
                
                <div class="flex-1 flex flex-col items-center gap-2 relative">
                    <!-- 自訂年月選擇器 -->
                    <button id="customMonthBtn" class="flex items-center gap-2 text-stone-700 font-bold text-lg hover:text-rose-500 transition-colors focus:outline-none px-3 py-1 rounded-lg">
                        <span id="monthPickerText">2026年08月</span>
                        <svg class="w-4 h-4 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                    </button>

                    <div id="customMonthMenu" class="hidden absolute top-full mt-2 left-1/2 -translate-x-1/2 w-64 bg-white rounded-2xl shadow-[0_12px_40px_rgba(0,0,0,0.12)] border border-stone-100 p-4 z-50">
                        <div class="flex justify-between items-center mb-4 px-2">
                            <button id="pickerPrevYear" class="text-stone-400 hover:text-rose-400 p-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
                            <span id="pickerYearText" class="font-bold text-stone-700 tracking-wider">2026</span>
                            <button id="pickerNextYear" class="text-stone-400 hover:text-rose-400 p-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
                        </div>
                        <div class="grid grid-cols-3 gap-2" id="pickerMonthGrid"></div>
                    </div>
                    
                    <!-- 🚩 自訂下拉選單 (確保不再使用原生 Select) -->
                    <div class="relative inline-block text-left" id="customMetricSelector">
                        <button type="button" id="metricDropdownBtn" class="flex items-center gap-1 text-xs bg-stone-100 hover:bg-stone-200 transition-colors rounded-full pl-3 pr-2 py-1.5 text-stone-600 font-medium focus:outline-none">
                            <span class="text-stone-400">顯示：</span>
                            <span id="metricDisplayText">體重</span>
                            <svg class="w-3.5 h-3.5 text-stone-400 ml-1 transition-transform" id="metricDropdownArrow" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                        </button>
                        <ul id="metricDropdownMenu" class="hidden absolute left-1/2 -translate-x-1/2 mt-2 w-24 bg-white rounded-xl shadow-[0_8px_24px_rgba(0,0,0,0.08)] border border-stone-100 py-1.5 z-50 overflow-hidden">
                            <li><button type="button" class="metric-option w-full text-center px-4 py-2 text-sm text-stone-600 hover:bg-rose-50 hover:text-rose-600 transition-colors font-medium" data-value="weight" data-text="體重">體重</button></li>
                            <li><button type="button" class="metric-option w-full text-center px-4 py-2 text-sm text-stone-600 hover:bg-rose-50 hover:text-rose-600 transition-colors font-medium" data-value="bodyFat" data-text="體脂">體脂</button></li>
                            <li><button type="button" class="metric-option w-full text-center px-4 py-2 text-sm text-stone-600 hover:bg-rose-50 hover:text-rose-600 transition-colors font-medium" data-value="waist" data-text="腰圍">腰圍</button></li>
                        </ul>
                    </div>
                </div>

                <button id="nextMonth" class="text-stone-400 hover:text-rose-400 p-2 shrink-0 transition-colors outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>
            <div id="calendarGrid" class="p-2"></div>
        </div>

        <!-- 視圖 3：設定視圖 -->
        <div id="view-settings" class="flex-1 flex flex-col hidden bg-stone-50 overflow-y-auto">
            <div class="p-5">
                <h2 class="text-xl font-bold text-stone-700 mb-6">個人設定</h2>
                <form id="settingsForm" class="space-y-5">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-stone-100">
                        <h3 class="text-xs font-bold text-stone-400 mb-4 uppercase tracking-wider">基礎資料</h3>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <label class="text-stone-600 text-sm font-medium">生理性別</label>
                                <select id="setGender" class="bg-stone-50 border border-stone-200 text-stone-700 text-sm rounded-lg focus:ring-rose-300 focus:border-rose-300 block p-2 outline-none">
                                    <option value="female">女性 (Female)</option>
                                    <option value="male">男性 (Male)</option>
                                </select>
                            </div>
                            <div class="flex justify-between items-center">
                                <label class="text-stone-600 text-sm font-medium">出生年份</label>
                                <input type="number" id="setBirthYear" class="w-24 text-right bg-stone-50 border border-stone-200 text-stone-700 text-sm rounded-lg focus:ring-rose-300 focus:border-rose-300 block p-2 outline-none">
                            </div>
                            <div class="flex justify-between items-center">
                                <label class="text-stone-600 text-sm font-medium">身高 (cm)</label>
                                <input type="number" id="setHeight" step="0.1" class="w-24 text-right bg-stone-50 border border-stone-200 text-stone-700 text-sm rounded-lg focus:ring-rose-300 focus:border-rose-300 block p-2 outline-none">
                            </div>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-stone-100">
                        <h3 class="text-xs font-bold text-stone-400 mb-4 uppercase tracking-wider">體態目標 (選填)</h3>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <label class="text-stone-600 text-sm font-medium">目標體重 (kg)</label>
                                <input type="number" id="setGoalWeight" step="0.1" class="w-24 text-right bg-stone-50 border border-stone-200 text-stone-700 text-sm rounded-lg focus:ring-rose-300 focus:border-rose-300 block p-2 outline-none">
                            </div>
                            <div class="flex justify-between items-center">
                                <label class="text-stone-600 text-sm font-medium">目標體脂 (%)</label>
                                <input type="number" id="setGoalBodyFat" step="0.1" class="w-24 text-right bg-stone-50 border border-stone-200 text-stone-700 text-sm rounded-lg focus:ring-rose-300 focus:border-rose-300 block p-2 outline-none">
                            </div>
                        </div>
                    </div>
                   <!-- 🚩 新增：帳號綁定卡片 -->
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-stone-100">
                        <h3 class="text-xs font-bold text-stone-400 mb-4 uppercase tracking-wider">帳號安全與同步</h3>
                        
                        <div class="space-y-3">
                            <p class="text-xs text-stone-500 leading-relaxed">
                                目前為訪客模式。綁定 Google 帳號可避免清除快取或更換手機時遺失紀錄。
                            </p>
                            
                            <!-- Google 登入按鈕掛載點 -->
                            <div id="googleSignInWrapper" class="w-full flex justify-center py-2">
                                <!-- Controller 會在這裡渲染 Google 原生按鈕 -->
                            </div>

                            <!-- 綁定成功後的狀態顯示 (預設隱藏) -->
                            <div id="accountBoundStatus" class="hidden flex items-center gap-2 bg-emerald-50 text-emerald-700 p-3 rounded-lg text-sm">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                                <span class="font-medium" id="boundEmailText">已綁定：example@gmail.com</span>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full bg-stone-800 hover:bg-stone-900 text-white font-bold py-3.5 rounded-xl mt-4 shadow-sm transition-colors flex justify-center items-center gap-2">
                        儲存設定
                    </button>
                </form>
            </div>
        </div>

        <!-- 底部導覽列 -->
        <nav class="bg-white border-t border-stone-100 flex justify-between items-center px-4 py-2 pb-6 shrink-0 text-[10px] text-stone-400 font-medium shadow-[0_-4px_20px_rgba(0,0,0,0.02)] z-10 relative">
            <button id="nav-calendar" class="flex flex-col items-center gap-1 hover:text-rose-400 w-12 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span>月曆</span>
            </button>
            <button id="nav-chart" class="flex flex-col items-center gap-1 text-rose-500 w-12 transition-colors mr-6">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <span>曲線</span>
            </button>
            <button id="nav-input" class="absolute left-1/2 -translate-x-1/2 -top-6 group">
                <div class="bg-rose-400 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-[0_8px_16px_rgba(251,113,133,0.3)] border-4 border-white group-hover:bg-rose-500 transition-all group-active:scale-95">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                </div>
            </button>
            <div class="w-12 ml-6"></div>
            <button id="nav-settings" class="flex flex-col items-center gap-1 hover:text-rose-400 w-12 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>設定</span>
            </button>
        </nav>

        <!-- 資料輸入 Modal -->
        <div id="inputModal" class="hidden absolute inset-0 bg-black/40 z-50 flex items-end justify-center">
            <div class="bg-white w-full rounded-t-3xl p-6 shadow-2xl transform transition-transform pb-12">
                <div class="flex justify-between items-center mb-6">
                    <h3 id="modalDateLabel" class="text-lg font-bold text-stone-700">記錄今日</h3>
                    <button id="closeModalBtn" class="text-stone-400 hover:text-stone-600 text-xl">✕</button>
                </div>
                <form id="recordForm" class="space-y-4">
                    <input type="hidden" id="inputDate" value="">
                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="block text-stone-500 text-xs mb-1">體重 (kg)</label>
                            <input type="number" id="inputWeight" step="0.1" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-stone-700 focus:outline-none focus:border-rose-300 focus:ring-1 focus:ring-rose-300">
                        </div>
                        <div class="flex-1">
                            <label class="block text-stone-500 text-xs mb-1">體脂率 (%)</label>
                            <input type="number" id="inputBodyFat" step="0.1" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-stone-700 focus:outline-none focus:border-rose-300 focus:ring-1 focus:ring-rose-300">
                        </div>
                    </div>
                    <div>
                        <label class="block text-stone-500 text-xs mb-1">腰圍 (cm) - 選填</label>
                        <input type="number" id="inputWaist" step="0.1" class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-stone-700 focus:outline-none focus:border-rose-300 focus:ring-1 focus:ring-rose-300">
                    </div>
                    <div id="periodWrapper" class="flex items-center justify-between bg-rose-50 p-3 rounded-xl border border-rose-100">
                        <span class="text-rose-800 text-sm font-medium">🩸 經期第一天</span>
                        <input type="checkbox" id="inputPeriod" class="w-5 h-5 accent-rose-500 rounded cursor-pointer">
                    </div>
                    <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 rounded-xl mt-4 shadow-sm transition-colors">
                        儲存紀錄
                    </button>
                </form>
            </div>
        </div>
    </main>

    <script type="module" src="./src/controllers/appController.js"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then((registration) => console.log('[PWA] Service Worker 註冊成功:', registration.scope))
            .catch((err) => console.error('[PWA] Service Worker 註冊失敗:', err));
        });
      }
    </script>
</body>
</html>
