<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我的輕盈日記</title>

    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#fff1f2">
    <!-- 🚩 替換為本機 assets 內的實體圖檔 -->
    <link rel="icon" type="image/png" href="./assets/192.png">

    <!-- 🚩 iOS 專用：Apple 設備會讀取這張圖作為桌面 App Icon -->
    <link rel="apple-touch-icon" href="./assets/192.png">

    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <script src="https://unpkg.com/dexie@latest/dist/dexie.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script
        src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
    <!-- 🚩 引入 Google Identity Services SDK -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body class="bg-stone-50 text-stone-800 font-sans antialiased">
    <main id="app"
        class="max-w-md mx-auto bg-white min-h-screen shadow-sm relative border-x border-stone-100 flex flex-col">

        <!-- 頂部 Header -->
        <header
            class="bg-rose-50 text-stone-700 p-4 flex justify-between items-center border-b border-rose-100 shrink-0">
            <div class="flex items-center gap-2">
                <h1 class="text-lg font-bold tracking-wide">我的輕盈日記</h1>
                <!-- 🚩 新增：離線狀態標籤 (預設隱藏) -->
                <div id="offlineBadge"
                    class="hidden flex items-center gap-1 bg-red-100 text-red-600 px-2 py-0.5 rounded-full text-[10px] font-bold">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 2.829a4.978 4.978 0 01-1.414-2.83m-1.414 5.658a9 9 0 01-2.167-9.238m7.824 2.167a1 1 0 111.414 1.414m-1.414-1.414L3 3m8.293 8.293l1.414 1.414">
                        </path>
                    </svg>
                    離線
                </div>
            </div>
            <!-- 🚩 替換：拔除手動按鈕，改為無感的狀態指示器 -->
            <div id="syncStatusUI"
                class="flex items-center gap-1.5 px-3 py-1.5 bg-white/60 border border-stone-200 rounded-full shadow-sm">
                <!-- 動態 Icon 容器 -->
                <div id="syncIconContainer" class="text-stone-400 flex items-center justify-center">
                    <!-- 預設顯示：已同步的打勾 -->
                    <svg class="w-3.5 h-3.5 text-emerald-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <!-- 動態文字 -->
                <span id="syncText" class="text-[11px] font-bold text-stone-500 tracking-wide">已同步</span>
            </div>
        </header>

        <!-- 視圖 1：圖表視圖 -->
        <div id="view-chart" class="flex-1 flex flex-col">
            <!-- 🚩 升級後的圖表專屬導覽列 -->
            <nav class="flex flex-col gap-3 bg-white p-3 border-b border-stone-100 shrink-0 z-10">
                <div class="flex justify-between items-center">
                    <!-- 數據切換器 -->
                    <div class="flex bg-stone-100 p-1 rounded-lg text-xs font-medium text-stone-500">
                        <button
                            class="metric-toggle-btn px-3 py-1.5 rounded-md bg-white shadow-sm text-rose-500 font-bold"
                            data-metric="weight">體重</button>
                        <button class="metric-toggle-btn px-3 py-1.5 rounded-md hover:text-stone-700 transition-colors"
                            data-metric="bodyFat">體脂</button>
                        <button class="metric-toggle-btn px-3 py-1.5 rounded-md hover:text-stone-700 transition-colors"
                            data-metric="waist">腰圍</button>
                    </div>
                    <!-- 區間切換器 -->
                    <div class="flex gap-1 text-xs">
                        <button class="chart-range-btn px-3 py-1.5 rounded-full bg-stone-200 text-stone-800 font-bold"
                            data-range="week">1週</button>
                        <button class="chart-range-btn px-3 py-1.5 rounded-full text-stone-400 hover:bg-stone-50"
                            data-range="month">1個月</button>
                        <button class="chart-range-btn px-3 py-1.5 rounded-full text-stone-400 hover:bg-stone-50"
                            data-range="year">1年</button>
                    </div>
                </div>
            </nav>
            <section class="p-4 bg-white flex-1 min-h-[400px]">
                <canvas id="bodyChart"></canvas>
            </section>
        </div>

        <!-- 視圖 2：日曆視圖 -->
        <div id="view-calendar" class="flex-1 flex flex-col hidden bg-stone-50">
            
            <!-- 上半部：年月切換器 (移除底部邊框，保留置中) -->
            <div class="p-4 pb-2 flex justify-between items-center bg-white relative z-30">
                <button id="prevMonth" class="text-stone-400 hover:text-rose-400 p-2 shrink-0 transition-colors outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
                </button>

                <div class="flex-1 flex flex-col items-center gap-2 relative">
                    <!-- 自訂年月選擇器 -->
                    <button id="customMonthBtn" class="flex items-center gap-2 text-stone-700 font-bold text-lg hover:text-rose-500 transition-colors focus:outline-none px-3 py-1 rounded-lg">
                        <span id="monthPickerText">2026年08月</span>
                        <svg class="w-4 h-4 text-stone-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                    </button>

                    <div id="customMonthMenu" class="hidden absolute top-full mt-2 left-1/2 -translate-x-1/2 w-64 bg-white rounded-2xl shadow-[0_12px_40px_rgba(0,0,0,0.12)] border border-stone-100 p-4 z-50">
                        <div class="flex justify-between items-center mb-4 px-2">
                            <button id="pickerPrevYear" class="text-stone-400 hover:text-rose-400 p-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg></button>
                            <span id="pickerYearText" class="font-bold text-stone-700 tracking-wider">2026</span>
                            <button id="pickerNextYear" class="text-stone-400 hover:text-rose-400 p-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg></button>
                        </div>
                        <div class="grid grid-cols-3 gap-2" id="pickerMonthGrid"></div>
                    </div>
                </div>

                <button id="nextMonth" class="text-stone-400 hover:text-rose-400 p-2 shrink-0 transition-colors outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </button>
            </div>

            <!-- 🚩 下半部：統一靠左的數據切換按鈕 (加上底部邊框與陰影) -->
            <div class="px-4 pb-3 bg-white border-b border-stone-100 shadow-sm relative z-20 flex justify-start">
                <div class="flex bg-stone-100 p-1 rounded-lg text-xs font-medium text-stone-500">
                    <button class="metric-toggle-btn px-3 py-1.5 rounded-md bg-white shadow-sm text-rose-500 font-bold" data-metric="weight">體重</button>
                    <button class="metric-toggle-btn px-3 py-1.5 rounded-md hover:text-stone-700 transition-colors" data-metric="bodyFat">體脂</button>
                    <button class="metric-toggle-btn px-3 py-1.5 rounded-md hover:text-stone-700 transition-colors" data-metric="waist">腰圍</button>
                </div>
            </div>

            <div id="calendarGrid" class="p-2"></div>
        </div>

        <!-- 視圖 3：設定視圖 -->
        <div id="view-settings" class="flex-1 flex flex-col hidden bg-stone-50 overflow-y-auto">
            <div class="p-5">
                <h2 class="text-xl font-bold text-stone-700 mb-6">個人設定</h2>
                <form id="settingsForm" class="space-y-5">
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-stone-100">
                        <h3 class="text-xs font-bold text-stone-400 mb-4 uppercase tracking-wider">基礎資料</h3>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <label class="text-stone-600 text-sm font-medium">生理性別</label>
                                <select id="setGender"
                                    class="bg-stone-50 border border-stone-200 text-stone-700 text-sm rounded-lg focus:ring-rose-300 focus:border-rose-300 block p-2 outline-none">
                                    <option value="female">女性 (Female)</option>
                                    <option value="male">男性 (Male)</option>
                                </select>
                            </div>
                            <div class="flex justify-between items-center">
                                <label class="text-stone-600 text-sm font-medium">出生年份</label>
                                <input type="number" id="setBirthYear"
                                    class="w-24 text-right bg-stone-50 border border-stone-200 text-stone-700 text-sm rounded-lg focus:ring-rose-300 focus:border-rose-300 block p-2 outline-none">
                            </div>
                            <div class="flex justify-between items-center">
                                <label class="text-stone-600 text-sm font-medium">身高 (cm)</label>
                                <input type="number" id="setHeight" step="0.1"
                                    class="w-24 text-right bg-stone-50 border border-stone-200 text-stone-700 text-sm rounded-lg focus:ring-rose-300 focus:border-rose-300 block p-2 outline-none">
                            </div>
                        </div>
                    </div>
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-stone-100">
                        <h3 class="text-xs font-bold text-stone-400 mb-4 uppercase tracking-wider">體態目標 (選填)</h3>
                        <div class="space-y-4">
                            <div class="flex justify-between items-center">
                                <label class="text-stone-600 text-sm font-medium">目標體重 (kg)</label>
                                <input type="number" id="setGoalWeight" step="0.1" class="w-24 text-right bg-stone-50 border border-stone-200 text-stone-700 text-sm rounded-lg focus:ring-rose-300 focus:border-rose-300 block p-2 outline-none">
                            </div>
                            <div class="flex justify-between items-center">
                                <label class="text-stone-600 text-sm font-medium">目標體脂 (%)</label>
                                <input type="number" id="setGoalBodyFat" step="0.1" class="w-24 text-right bg-stone-50 border border-stone-200 text-stone-700 text-sm rounded-lg focus:ring-rose-300 focus:border-rose-300 block p-2 outline-none">
                            </div>
                            <!-- 🚩 新增：腰圍目標輸入框 -->
                            <div class="flex justify-between items-center">
                                <label class="text-stone-600 text-sm font-medium">目標腰圍 (cm)</label>
                                <input type="number" id="setGoalWaist" step="0.1" class="w-24 text-right bg-stone-50 border border-stone-200 text-stone-700 text-sm rounded-lg focus:ring-rose-300 focus:border-rose-300 block p-2 outline-none">
                            </div>
                        </div>
                    </div>
                    <!-- 🚩 新增：帳號綁定卡片 -->
                    <div class="bg-white p-4 rounded-2xl shadow-sm border border-stone-100">
                        <h3 class="text-xs font-bold text-stone-400 mb-4 uppercase tracking-wider">帳號安全與同步</h3>

                        <div class="space-y-3">
                            <!-- 🚩 修正：為訪客提示文字加上 ID，讓 Controller 可以控制它 -->
                            <p id="guestModeText" class="text-xs text-stone-500 leading-relaxed">
                                目前為訪客模式。綁定 Google 帳號可避免清除快取或更換手機時遺失紀錄。
                            </p>

                            <!-- Google 登入按鈕掛載點 -->
                            <div id="googleSignInWrapper" class="w-full flex justify-center py-2">
                                <!-- Controller 會在這裡渲染 Google 原生按鈕 -->
                            </div>
                            <!-- 在設定頁面的帳號安全區塊內加入 -->
                            <!-- 🚩 修正：務必加上 type="button" 防止觸發表單 Submit -->
                            <button type="button" id="logoutBtn"
                                class="hidden w-full mt-4 py-3 rounded-xl bg-stone-200 text-stone-600 font-bold hover:bg-stone-300 hover:text-rose-600 transition-colors">
                                登出並清除本機資料
                            </button>
                            <!-- 🚩 新增：PWA 安裝按鈕 (預設隱藏，只有在可安裝環境才會出現) -->
                            <button type="button" id="installAppBtn"
                                class="hidden w-full mt-3 py-3 rounded-xl bg-rose-50 text-rose-600 font-bold border border-rose-200 hover:bg-rose-100 transition-colors flex justify-center items-center gap-2">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                                </svg>
                                安裝 App 到手機桌面
                            </button>

                            <!-- 綁定成功後的狀態顯示 (預設隱藏) -->
                            <div id="accountBoundStatus"
                                class="hidden flex items-center gap-2 bg-emerald-50 text-emerald-700 p-3 rounded-lg text-sm">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                                </svg>
                                <span class="font-medium" id="boundEmailText">已綁定：example@gmail.com</span>
                            </div>
                        </div>
                    </div>

                    <button type="submit"
                        class="w-full bg-stone-800 hover:bg-stone-900 text-white font-bold py-3.5 rounded-xl mt-4 shadow-sm transition-colors flex justify-center items-center gap-2">
                        儲存設定
                    </button>
                </form>
            </div>
        </div>

        <!-- 底部導覽列 -->
        <nav
            class="bg-white border-t border-stone-100 flex justify-between items-center px-4 py-2 pb-6 shrink-0 text-[10px] text-stone-400 font-medium shadow-[0_-4px_20px_rgba(0,0,0,0.02)] z-10 relative">
            <button id="nav-calendar"
                class="flex flex-col items-center gap-1 hover:text-rose-400 w-12 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z">
                    </path>
                </svg>
                <span>月曆</span>
            </button>
            <button id="nav-chart" class="flex flex-col items-center gap-1 text-rose-500 w-12 transition-colors mr-6">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                    </path>
                </svg>
                <span>曲線</span>
            </button>
            <button id="nav-input" class="absolute left-1/2 -translate-x-1/2 -top-6 group">
                <div
                    class="bg-rose-400 text-white w-14 h-14 rounded-full flex items-center justify-center shadow-[0_8px_16px_rgba(251,113,133,0.3)] border-4 border-white group-hover:bg-rose-500 transition-all group-active:scale-95">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                    </svg>
                </div>
            </button>
            <div class="w-12 ml-6"></div>
            <button id="nav-settings"
                class="flex flex-col items-center gap-1 hover:text-rose-400 w-12 transition-colors">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z">
                    </path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                        d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
                <span>設定</span>
            </button>
        </nav>

        <!-- 資料輸入 Modal -->
        <div id="inputModal" class="hidden absolute inset-0 bg-black/40 z-50 flex items-end justify-center">
            <div class="bg-white w-full rounded-t-3xl p-6 shadow-2xl transform transition-transform pb-12">
                <div class="flex justify-between items-center mb-6">
                    <h3 id="modalDateLabel" class="text-lg font-bold text-stone-700">記錄今日</h3>
                    <button id="closeModalBtn" class="text-stone-400 hover:text-stone-600 text-xl">✕</button>
                </div>
                <form id="recordForm" class="space-y-4">
                    <input type="hidden" id="inputDate" value="">
                    <div class="flex gap-4">
                        <div class="flex-1">
                            <label class="block text-stone-500 text-xs mb-1">體重 (kg)</label>
                            <input type="number" id="inputWeight" step="0.1"
                                class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-stone-700 focus:outline-none focus:border-rose-300 focus:ring-1 focus:ring-rose-300">
                        </div>
                        <div class="flex-1">
                            <label class="block text-stone-500 text-xs mb-1">體脂率 (%)</label>
                            <input type="number" id="inputBodyFat" step="0.1"
                                class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-stone-700 focus:outline-none focus:border-rose-300 focus:ring-1 focus:ring-rose-300">
                        </div>
                    </div>
                    <div>
                        <label class="block text-stone-500 text-xs mb-1">腰圍 (cm) - 選填</label>
                        <input type="number" id="inputWaist" step="0.1"
                            class="w-full bg-stone-50 border border-stone-200 rounded-xl p-3 text-stone-700 focus:outline-none focus:border-rose-300 focus:ring-1 focus:ring-rose-300">
                    </div>
                    <div id="periodWrapper"
                        class="flex items-center justify-between bg-rose-50 p-3 rounded-xl border border-rose-100">
                        <span class="text-rose-800 text-sm font-medium">🩸 月經期間</span>
                        <input type="checkbox" id="inputPeriod" class="w-5 h-5 accent-rose-500 rounded cursor-pointer">
                    </div>
                    <!-- 🚩 新增：清除與儲存按鈕的 Flex 佈局 -->
                    <div class="flex gap-3 mt-4">
                        <button type="button" id="clearRecordBtn" 
                            class="w-1/3 bg-stone-100 hover:bg-stone-200 text-stone-600 font-bold py-3 rounded-xl shadow-sm transition-colors text-sm">
                            清除
                        </button>
                        <button type="submit" 
                            class="flex-1 bg-rose-500 hover:bg-rose-600 text-white font-bold py-3 rounded-xl shadow-sm transition-colors">
                            儲存紀錄
                        </button>
                    </div>
                </form>
            </div>
        </div>
        <!-- 🚩 新增：自訂登出確認 Modal -->
        <div id="logoutModal" class="hidden absolute inset-0 bg-black/40 z-50 flex items-center justify-center p-4">
            <div class="bg-white w-full max-w-sm rounded-3xl p-6 shadow-2xl transform transition-transform">
                <div class="w-12 h-12 rounded-full bg-red-50 text-red-500 flex items-center justify-center mb-4">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                        </path>
                    </svg>
                </div>
                <h3 class="text-xl font-bold text-stone-800 mb-2">確定要登出嗎？</h3>
                <p class="text-sm text-stone-500 mb-6 leading-relaxed">
                    登出將會徹底清除本機的所有快取資料。請確保您的所有紀錄都已儲存至雲端。
                </p>
                <div class="flex gap-3">
                    <button id="cancelLogoutBtn"
                        class="flex-1 py-3 rounded-xl bg-stone-100 text-stone-600 font-bold hover:bg-stone-200 transition-colors">取消</button>
                    <button id="confirmLogoutBtn"
                        class="flex-1 py-3 rounded-xl bg-red-500 text-white font-bold hover:bg-red-600 transition-colors shadow-sm">登出並清除</button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="./src/controllers/appController.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then((registration) => console.log('[PWA] Service Worker 註冊成功:', registration.scope))
                    .catch((err) => console.error('[PWA] Service Worker 註冊失敗:', err));
            });
        }
    </script>
</body>

</html>
